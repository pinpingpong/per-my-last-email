<script type="module">
// Pure game logic. No DOM. Shared by the browser UI and tools/simulate.mjs (Node).
// All functions mutate and/or return the plain-object game state, so it can be
// saved to localStorage as JSON.
//
// Phases: week -> (case, opened mid-week by a choice with opensCase) -> week ... ->
// after week 12: epilogue (only if exposed) -> ending.

const STATS = ['sanity', 'performance', 'reputation', 'allies'];

function newGame(balance) {
  return {
    week: 1,
    phase: 'week', // week | case | epilogue | ending
    stats: { ...balance.start },
    evidence: [],
    flags: [],
    seen: [],
    queue: [], // event ids forced into next draw (choice.next)
    hand: null, // event ids drawn for the current week; null = not drawn yet
    handIndex: 0,
    history: [],
    pending: null, // { event, choice } waiting on the case picker
    notice: null, // one-off message for the UI (e.g. Marcus resigned)
    score: null, // case score, set when you tell Derek (or at season end)
    outcome: null,
    ending: null,
  };
}

const weightOf = (ev) => ev.weight ?? 1;
const hasAll = (s, flags = []) => flags.every((f) => s.flags.includes(f));

// Event text, overridden by the first variant whose flags all match.
function eventText(ev, s) {
  for (const v of ev.variants || []) if (hasAll(s, v.if?.flags)) return v.text;
  return ev.text;
}

function isEligible(ev, s) {
  const [lo, hi] = ev.weeks || [1, Infinity];
  if (s.week < lo || s.week > hi) return false;
  if (ev.once !== false && s.seen.includes(ev.id)) return false;
  const r = ev.requires || {};
  if (!hasAll(s, r.flags)) return false;
  if (r.notFlags && r.notFlags.some((f) => s.flags.includes(f))) return false;
  // Once Marcus resigns, nothing that needs him can happen.
  if (s.flags.includes('marcus-resigned') && (r.flags || []).includes('marcus-joined')) return false;
  if (r.stats) {
    for (const [k, [min, max]] of Object.entries(r.stats)) {
      if (s.stats[k] < min || s.stats[k] > max) return false;
    }
  }
  return true;
}

// Draw this week's cards: queued follow-ups first, then story beats, then weighted picks.
function drawWeek(s, events, balance, rng = Math.random) {
  if (s.phase === 'epilogue') {
    s.hand = events.filter((e) => e.epilogue && isEligible(e, s)).map((e) => e.id);
    s.handIndex = 0;
    return s.hand;
  }
  const byId = new Map(events.map((e) => [e.id, e]));
  const [minN, maxN] = balance.eventsPerWeek;
  const n = minN + Math.floor(rng() * (maxN - minN + 1));
  const hand = [];
  const leftover = [];
  for (const id of s.queue) {
    const ev = byId.get(id);
    if (!ev || (ev.once !== false && s.seen.includes(id)) || hand.includes(id)) continue;
    if (hand.length < n) hand.push(id);
    else leftover.push(id);
  }
  // weight 0 = only reachable via choice.next (story chain), never drawn randomly.
  const pool = events.filter(
    (e) => !e.epilogue && !hand.includes(e.id) && isEligible(e, s) && (e.always || weightOf(e) > 0),
  );
  // Story beats (always: true) jump the queue whenever eligible.
  for (const ev of pool.filter((e) => e.always).sort((a, b) => (a.order ?? 0) - (b.order ?? 0))) {
    hand.push(ev.id);
    pool.splice(pool.indexOf(ev), 1);
  }
  while (hand.length < n && pool.length) {
    let r = rng() * pool.reduce((t, e) => t + weightOf(e), 0);
    let i = 0;
    for (; i < pool.length - 1; i++) {
      r -= weightOf(pool[i]);
      if (r < 0) break;
    }
    hand.push(pool[i].id);
    pool.splice(i, 1);
  }
  s.queue = leftover;
  s.hand = hand;
  s.handIndex = 0;
  return hand;
}

// A minigame choice: base choice merged with its win or lose branch.
function resolveChoice(c, won) {
  if (!c.minigame) return c;
  const branch = won ? c.minigame.win : c.minigame.lose;
  const effects = { ...(c.effects || {}) };
  for (const [k, d] of Object.entries(branch.effects || {})) effects[k] = (effects[k] || 0) + d;
  return { ...c, ...branch, label: c.label, effects, minigame: undefined };
}

function applyChoice(s, ev, idx, balance, opts = {}) {
  const c = resolveChoice(ev.choices[idx], opts.won);
  for (const [k, d] of Object.entries(c.effects || {})) {
    const v = (s.stats[k] ?? 0) + d;
    s.stats[k] = k === 'allies' || k === 'strikes' ? Math.max(0, v) : Math.max(0, Math.min(100, v));
  }
  if (c.addEvidence && !s.evidence.some((e) => e.id === c.addEvidence.id)) {
    s.evidence.push({ ...c.addEvidence, week: s.week });
  }
  if (c.removeEvidence) s.evidence = s.evidence.filter((e) => !c.removeEvidence.includes(e.id));
  for (const f of c.setFlags || []) if (!s.flags.includes(f)) s.flags.push(f);
  if (c.clearFlags) s.flags = s.flags.filter((f) => !c.clearFlags.includes(f));
  if (c.next) s.queue.push(c.next);
  if (!s.seen.includes(ev.id)) s.seen.push(ev.id);
  s.history.push({ week: s.week, event: ev.id, choice: idx });
  s.handIndex++;

  const limit = balance?.marcus?.strikeLimit;
  if (limit && (s.stats.strikes ?? 0) >= limit && !s.flags.includes('marcus-resigned')) {
    s.flags.push('marcus-resigned');
    s.notice = 'marcusResigned';
  }
  if (c.opensCase) {
    s.phase = 'case';
    s.pending = { event: ev.id, choice: idx };
  }
  if (c.endsGame) end(s, c.endsGame);
  else if (s.stats.sanity <= 0) end(s, 'burnout');
  else if (s.stats.performance <= 0) end(s, 'managedOut');
  return c;
}

function end(s, ending) {
  s.phase = 'ending';
  s.ending = ending;
}

function caseScore(s, pickedIds, balance) {
  const hr = balance.hr;
  const picked = s.evidence.filter((e) => pickedIds.includes(e.id)).slice(0, hr.maxEvidence);
  const evidence = picked.reduce((t, e) => t + e.strength, 0);
  const allies = s.stats.allies * hr.allyWeight;
  const reputation = s.stats.reputation >= hr.reputationBonus.above ? hr.reputationBonus.bonus : 0;
  // Derek thought you were close to her, so your account carries extra weight.
  const favourite = s.flags.includes('favourite') && s.flags.includes('testified') ? hr.favouriteBonus || 0 : 0;
  return { evidence, allies, reputation, favourite, total: evidence + allies + reputation + favourite };
}

// The call with Derek: what you tell him is stored; the outcome lands after week 12.
function submitCase(s, pickedIds, balance) {
  s.score = caseScore(s, pickedIds, balance);
  s.phase = 'week';
  s.pending = null;
  return s.score;
}

function outcomeFor(total, balance) {
  const t = balance.hr.thresholds;
  return total >= t.exposed ? 'exposed' : total >= t.gracefulExit ? 'gracefulExit' : 'failingUpward';
}

function finishSeason(s, balance) {
  if (s.flags.includes('marcus-resigned')) return end(s, 'marcusResigned');
  if (!s.score) s.score = caseScore(s, [], balance); // you never told Derek anything
  s.outcome = outcomeFor(s.score.total, balance);
  // You tipped her off at the sinks: she resigns before Monday's meeting can happen.
  if (s.outcome !== 'failingUpward' && s.flags.includes('leaked')) s.outcome = 'sheResigned';
  if (s.outcome !== 'exposed') return end(s, s.outcome);
  s.flags.push('exposed');
  s.phase = 'epilogue';
  s.hand = null;
  s.handIndex = 0;
}

function endWeek(s, balance) {
  if (s.phase === 'ending') return;
  if (s.phase === 'epilogue') return end(s, s.outcome);
  s.week++;
  s.hand = null;
  s.handIndex = 0;
  if (s.week > balance.weeks) finishSeason(s, balance);
}

// Extra ending sentences that depend on what happened (endings._lines).
function endingLines(s, lines = []) {
  return lines
    .filter((l) => hasAll(s, l.if?.flags))
    .filter((l) => !(l.notFlags || []).some((f) => s.flags.includes(f)))
    .filter((l) => !l.onlyEndings || l.onlyEndings.includes(s.ending))
    .map((l) => l.text);
}

// Strongest evidence ids, for simulations and as a UI hint.
function bestPick(s, balance) {
  return [...s.evidence]
    .sort((a, b) => b.strength - a.strength)
    .slice(0, balance.hr.maxEvidence)
    .map((e) => e.id);
}

// Minigame: Escape to Nebula.
// Veronica is coming to collect you for a toilet trip. Reach meeting room Nebula
// (top left) before she sees you. Her sight cone is blocked by desks and pillars.
// Contract shared by all minigames: play(root) -> Promise<{ won: boolean }>.

function toiletDodge(root) {
  return new Promise((resolve) => {
    const W = 360, H = 480, TIME = 30;
    root.innerHTML = `
      <div class="mg">
        <p class="card-meta">Minigame · Escape to Nebula</p>
        <p class="mg-help">Reach <b>Nebula</b> (top left) before Veronica sees you. Hide behind desks and pillars. Arrow keys / WASD, or the pad.</p>
        <canvas class="mg-canvas" width="${W}" height="${H}"></canvas>
        <div class="mg-pad">
          <button data-k="up" aria-label="Up">▲</button>
          <button data-k="left" aria-label="Left">◀</button>
          <button data-k="down" aria-label="Down">▼</button>
          <button data-k="right" aria-label="Right">▶</button>
        </div>
        <p class="mg-status" aria-live="polite"></p>
        <button class="btn" id="mg-skip">Skip (she finds you)</button>
      </div>`;
    const cv = root.querySelector('canvas');
    const g = cv.getContext('2d');
    const status = root.querySelector('.mg-status');

    const goal = { x: 0, y: 0, w: 110, h: 84 };
    const walls = [
      { x: 150, y: 50, w: 150, h: 24, kind: 'desk' },
      { x: 40, y: 150, w: 110, h: 24, kind: 'desk' }, { x: 210, y: 150, w: 110, h: 24, kind: 'desk' },
      { x: 40, y: 240, w: 110, h: 24, kind: 'desk' }, { x: 210, y: 240, w: 110, h: 24, kind: 'desk' },
      { x: 40, y: 330, w: 110, h: 24, kind: 'desk' }, { x: 210, y: 330, w: 110, h: 24, kind: 'desk' },
      { x: 166, y: 196, w: 26, h: 26, kind: 'pillar' }, { x: 166, y: 286, w: 26, h: 26, kind: 'pillar' },
      { x: 320, y: 410, w: 26, h: 26, kind: 'plant' }, { x: 120, y: 0, w: 14, h: 84, kind: 'wall' },
    ];
    const path = [[180, 207], [340, 207], [340, 120], [180, 120], [180, 207], [180, 297], [180, 387], [340, 387], [340, 297], [180, 297]];
    const P = { x: 300, y: 455, r: 9 };
    const V = { x: 180, y: 207, r: 11, dir: 0, i: 1, speed: 1.05, range: 135, fov: Math.PI / 2.6 };
    const keys = {};
    const KEYMAP = { ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down', ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right' };
    const start = performance.now();
    let raf = 0, done = false;

    const inRect = (x, y, r) => x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h;
    const blocked = (x, y) => x < 0 || y < 0 || x > W || y > H || walls.some((w) => inRect(x, y, w));
    const hitsWall = (x, y, r) => walls.some((w) => x + r > w.x && x - r < w.x + w.w && y + r > w.y && y - r < w.y + w.h) || x < r || y < r || x > W - r || y > H - r;
    const castRay = (a) => {
      for (let d = 0; d < V.range; d += 4) if (blocked(V.x + Math.cos(a) * d, V.y + Math.sin(a) * d)) return d;
      return V.range;
    };
    const sees = () => {
      const dx = P.x - V.x, dy = P.y - V.y, dist = Math.hypot(dx, dy);
      if (dist > V.range) return false;
      let diff = Math.atan2(dy, dx) - V.dir;
      diff = Math.atan2(Math.sin(diff), Math.cos(diff));
      if (Math.abs(diff) > V.fov / 2) return false;
      return castRay(Math.atan2(dy, dx)) >= dist - P.r;
    };

    const onKey = (down) => (e) => { const k = KEYMAP[e.code]; if (k) { keys[k] = down; e.preventDefault(); } };
    const kd = onKey(true), ku = onKey(false);
    window.addEventListener('keydown', kd);
    window.addEventListener('keyup', ku);
    root.querySelectorAll('.mg-pad button').forEach((b) => {
      const k = b.dataset.k;
      const on = (e) => { keys[k] = true; e.preventDefault(); };
      const off = () => { keys[k] = false; };
      b.addEventListener('pointerdown', on);
      ['pointerup', 'pointerleave', 'pointercancel'].forEach((ev) => b.addEventListener(ev, off));
    });

    function finish(won, msg) {
      if (done) return;
      done = true;
      cancelAnimationFrame(raf);
      window.removeEventListener('keydown', kd);
      window.removeEventListener('keyup', ku);
      status.textContent = msg;
      status.className = `mg-status ${won ? 'won' : 'lost'}`;
      draw(won ? null : true);
      setTimeout(() => resolve({ won }), 1400);
    }
    root.querySelector('#mg-skip').onclick = () => finish(false, 'You stay at your desk. "Come, toilet."');

    function step() {
      const sp = 2.1;
      const mx = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
      const my = (keys.down ? 1 : 0) - (keys.up ? 1 : 0);
      const norm = mx && my ? Math.SQRT1_2 : 1;
      if (!hitsWall(P.x + mx * sp * norm, P.y, P.r)) P.x += mx * sp * norm;
      if (!hitsWall(P.x, P.y + my * sp * norm, P.r)) P.y += my * sp * norm;

      const [tx, ty] = path[V.i];
      const dx = tx - V.x, dy = ty - V.y, d = Math.hypot(dx, dy);
      if (d < 2) V.i = (V.i + 1) % path.length;
      else {
        const want = Math.atan2(dy, dx);
        let diff = Math.atan2(Math.sin(want - V.dir), Math.cos(want - V.dir));
        V.dir += Math.max(-0.12, Math.min(0.12, diff));
        V.x += (dx / d) * V.speed;
        V.y += (dy / d) * V.speed;
      }
    }

    function draw(caught) {
      g.fillStyle = '#e9e2d4'; g.fillRect(0, 0, W, H);
      g.fillStyle = '#a5d8ff'; g.fillRect(goal.x, goal.y, goal.w, goal.h);
      g.fillStyle = '#1864ab'; g.font = 'bold 13px system-ui, sans-serif'; g.textAlign = 'center';
      g.fillText('NEBULA', goal.x + goal.w / 2, goal.y + goal.h / 2 + 4);
      // sight cone, clipped by obstacles
      g.beginPath(); g.moveTo(V.x, V.y);
      for (let i = 0; i <= 24; i++) {
        const a = V.dir - V.fov / 2 + (V.fov * i) / 24, r = castRay(a);
        g.lineTo(V.x + Math.cos(a) * r, V.y + Math.sin(a) * r);
      }
      g.closePath(); g.fillStyle = caught ? 'rgba(224,49,49,0.45)' : 'rgba(224,49,49,0.22)'; g.fill();
      for (const w of walls) {
        g.fillStyle = { desk: '#a07850', pillar: '#868e96', plant: '#40c057', wall: '#495057' }[w.kind];
        g.fillRect(w.x, w.y, w.w, w.h);
      }
      g.fillStyle = '#3b5bdb'; g.beginPath(); g.arc(P.x, P.y, P.r, 0, 7); g.fill();
      g.fillStyle = '#fff'; g.font = 'bold 9px system-ui'; g.fillText('YOU', P.x, P.y + 3);
      g.fillStyle = '#c92a2a'; g.beginPath(); g.arc(V.x, V.y, V.r, 0, 7); g.fill();
      g.fillStyle = '#fff'; g.fillText('V', V.x, V.y + 3);
      const left = Math.max(0, TIME - (performance.now() - start) / 1000);
      g.fillStyle = '#212529'; g.font = 'bold 14px ui-monospace, monospace'; g.textAlign = 'right';
      g.fillText(`${left.toFixed(1)}s`, W - 8, 20);
    }

    function loop() {
      step();
      draw(false);
      if (inRect(P.x, P.y, goal)) return finish(true, 'You slip into Nebula and lock the door. She walks right past. Freedom (for 30 minutes).');
      if (sees()) return finish(false, '"THERE you are. Come, toilet."');
      if ((performance.now() - start) / 1000 > TIME) return finish(false, 'Too slow. She finds you hiding behind the printer.');
      raf = requestAnimationFrame(loop);
    }
    raf = requestAnimationFrame(loop);
  });
}

// Minigame registry. A choice with { "minigame": { "id": "<key>", "win": {...}, "lose": {...} } }
// runs the matching game, then applies win or lose effects/result on top of the choice.
// To add one: write src/minigames/<name>.js exporting play(root) -> Promise<{ won }>,
// register it here, and add the file to MODULES in tools/build_single.py.

const MINIGAMES = {
  'toilet-dodge': toiletDodge,
};

const E = { STATS, newGame, eventText, isEligible, drawWeek, resolveChoice, applyChoice, caseScore, submitCase, outcomeFor, endWeek, endingLines, bestPick };

const SAVE_KEY = 'celestial-save-v2';
const STAT_LABEL = { sanity: 'Sanity', performance: 'Performance', reputation: 'Reputation', allies: 'Allies', strikes: 'Marcus strikes' };
const ENDINGS_KEY = 'celestial-endings-v1';
const TYPE_LABEL = { written: 'Written · strong', witnessed: 'Witnessed · medium', recalled: 'Recalled · weak' };

let D; // loaded data
let S; // game state

const $ = (sel) => document.querySelector(sel);
const esc = (v) =>
  String(v).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

async function getJSON(path) {
  const r = await fetch(path);
  if (!r.ok) throw new Error(`${path}: ${r.status}`);
  return r.json();
}

// Single-file build (tools/build_single.py) injects window.__GAME_DATA__ and window.__ASSETS__.
const asset = (path) => (window.__ASSETS__ && window.__ASSETS__[path]) || path;

async function loadData() {
  if (window.__GAME_DATA__) {
    const g = window.__GAME_DATA__;
    D = { ...g, byId: new Map(g.events.map((e) => [e.id, e])) };
    return;
  }
  const [balance, endings, flavor, cast, index] = await Promise.all(
    ['balance', 'endings', 'flavor', 'cast', 'events/index'].map((p) => getJSON(`data/${p}.json`)),
  );
  const events = (await Promise.all(index.files.map((f) => getJSON(`data/events/${f}`)))).flat();
  D = { balance, endings, flavor, cast, events, byId: new Map(events.map((e) => [e.id, e])) };
}

// ---------- save ----------
function save() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch {}
}
function readSave() {
  try { return JSON.parse(localStorage.getItem(SAVE_KEY)); } catch { return null; }
}
function clearSave() {
  try { localStorage.removeItem(SAVE_KEY); } catch {}
}

function foundEndings() {
  try { return JSON.parse(localStorage.getItem(ENDINGS_KEY)) || []; } catch { return []; }
}
function recordEnding(id) {
  try {
    const found = foundEndings();
    if (!found.includes(id)) localStorage.setItem(ENDINGS_KEY, JSON.stringify([...found, id]));
  } catch {}
}

// ---------- rendering helpers ----------
function screen(html) {
  const app = $('#app');
  app.innerHTML = html;
  app.focus();
  window.scrollTo(0, 0);
}

function renderHud() {
  const hud = $('#hud');
  if (!S) { hud.hidden = true; return; }
  hud.hidden = false;
  const bar = (k) => `
    <div class="stat stat-${k}">
      <span class="stat-label">${STAT_LABEL[k]}</span>
      <span class="meter"><span style="width:${S.stats[k]}%"></span></span>
      <span class="stat-val">${S.stats[k]}</span>
    </div>`;
  const act = (D.flavor.acts || []).find((a) => S.week >= a.from && S.week <= a.to);
  const week = {
    week: `Week ${S.week} / ${D.balance.weeks}${act ? ` · ${act.title.split(' · ')[1]}` : ''}`,
    case: 'Phone call · Derek',
    epilogue: 'Monday',
    ending: 'The end',
  }[S.phase];
  hud.innerHTML = `
    <div class="hud-top">
      <span class="week">${week}</span>
      <span class="allies">Allies: <b>${S.stats.allies}</b></span>
      <button class="link" id="open-evidence">Evidence (${S.evidence.length})</button>
    </div>
    <div class="stats">${bar('sanity')}${bar('performance')}${bar('reputation')}</div>
    ${S.flags.includes('knows-strikes') && !S.flags.includes('marcus-resigned') ? strikeMeter() : ''}`;
  $('#open-evidence').onclick = openEvidence;
}

function strikeMeter() {
  const limit = D.balance.marcus.strikeLimit;
  const n = Math.min(S.stats.strikes ?? 0, limit);
  const dots = Array.from({ length: limit }, (_, i) => `<span class="strike ${i < n ? 'on' : ''}"></span>`).join('');
  return `<div class="strikes" title="At ${limit}, Marcus resigns"><span class="stat-label">Marcus's strikes</span><span class="strike-dots">${dots}</span><span class="stat-val">${n}/${limit}</span></div>`;
}

function evidenceItem(e) {
  return `<span class="ev-label">${esc(e.label)}</span>
    <span class="ev-meta ev-${esc(e.type)}">${TYPE_LABEL[e.type] || esc(e.type)} · week ${e.week}</span>`;
}

function openEvidence() {
  const dlg = $('#evidence');
  const list = S.evidence.length
    ? `<ul class="ev-list">${S.evidence.map((e) => `<li>${evidenceItem(e)}</li>`).join('')}</ul>`
    : `<p class="muted">Empty. Your case is currently "trust me".</p>`;
  dlg.innerHTML = `<h2>Evidence log</h2>${list}
    <p class="muted small">Written beats witnessed beats recalled. When it counts, you'll only have time to tell ${D.balance.hr.maxEvidence} things.</p>
    <button class="btn" id="close-evidence">Close</button>`;
  $('#close-evidence').onclick = () => dlg.close();
  dlg.showModal();
}

function effectChips(c) {
  const chips = Object.entries(c.effects || {})
    .filter(([k, d]) => d && (k !== 'strikes' || S.flags.includes('knows-strikes')))
    .map(([k, d]) => `<span class="chip ${(k === 'strikes' ? -d : d) > 0 ? 'up' : 'down'}">${d > 0 ? '+' : ''}${d} ${STAT_LABEL[k]}</span>`);
  if (c.addEvidence) chips.push(`<span class="chip ev">Evidence: ${esc(c.addEvidence.label)}</span>`);
  return chips.join('');
}

// ---------- screens ----------
function showTitle() {
  S = null;
  renderHud();
  const saved = readSave();
  screen(`
    <section class="title">
      <img class="hero" src="${asset('assets/title.svg')}" alt="Night skyline with the Celestial Pte Ltd tower">
      <p class="company">${esc(D.flavor.company)}</p>
      <p class="tagline">${esc(D.flavor.tagline)}</p>
      <h1>Per My Last Email</h1>
      <p class="pitch">Survive ${D.balance.weeks} weeks under a workplace bully. Keep receipts. Decide whether to speak up.</p>
      <div class="actions">
        ${saved && saved.phase !== 'ending' ? `<button class="btn primary" id="continue">Continue (week ${saved.week})</button>` : ''}
        <button class="btn ${saved && saved.phase !== 'ending' ? '' : 'primary'}" id="new">New game</button>
      </div>
      ${gallery()}
      <p class="muted small">A work of satire. All characters and companies are fictional.</p>
    </section>`);
  $('#new').onclick = () => { S = E.newGame(D.balance); save(); route(); };
  if ($('#continue')) $('#continue').onclick = () => { S = saved; route(); };
}

function gallery() {
  const ids = Object.keys(D.endings).filter((k) => !k.startsWith('_'));
  const found = foundEndings();
  if (!found.length) return '';
  const items = ids.map((id) => `<li class="${found.includes(id) ? 'got' : ''}">${found.includes(id) ? esc(D.endings[id].title) : '???'}</li>`).join('');
  return `<div class="gallery"><p class="card-meta">Endings found: ${found.filter((f) => ids.includes(f)).length} / ${ids.length}</p><ul>${items}</ul></div>`;
}

function route() {
  renderHud();
  if (S.phase === 'ending') return showEnding();
  if (S.phase === 'case') return showCase();
  if (S.hand === null) {
    E.drawWeek(S, D.events, D.balance);
    save();
  }
  const act = (D.flavor.acts || []).find((a) => a.from === S.week);
  if (S.phase === 'week' && act && S.handIndex === 0 && S.actShown !== act.from) return showAct(act);
  if (S.hand.length === 0) return showQuietWeek();
  if (S.handIndex < S.hand.length) return showCard();
  return showWeekEnd();
}

function sceneBanner(scene = 'office', speakers = []) {
  const portraits = speakers
    .filter((id) => D.cast[id])
    .map((id) => `<img class="portrait" src="${asset(`assets/portraits/${id}.svg`)}" alt="${esc(D.cast[id].name)}">`)
    .join('');
  return `<div class="scene">
    <img class="scene-bg" src="${asset(`assets/scenes/${scene}.svg`)}" alt="">
    ${portraits ? `<div class="portraits">${portraits}</div>` : ''}
  </div>`;
}

function speakerLine(ev) {
  const p = ev.speaker && D.cast[ev.speaker];
  return p ? `<p class="from"><b>${esc(p.name)}</b> · ${esc(p.title)}</p>` : '';
}

function showCard() {
  const ev = D.byId.get(S.hand[S.handIndex]);
  screen(`
    <article class="card has-scene">
      ${sceneBanner(ev.scene, ev.speaker ? [ev.speaker] : [])}
      <p class="card-meta">${S.phase === 'epilogue' ? 'Monday' : `Week ${S.week}`} · ${S.handIndex + 1} of ${S.hand.length}</p>
      ${speakerLine(ev)}
      <p class="card-text">${esc(E.eventText(ev, S))}</p>
      <div class="choices">
        ${ev.choices.map((c, i) => `<button class="btn choice" data-i="${i}">${esc(c.label)}</button>`).join('')}
      </div>
    </article>`);
  document.querySelectorAll('.choice').forEach((b) => {
    b.onclick = async () => {
      const i = Number(b.dataset.i);
      const mg = ev.choices[i].minigame;
      let won;
      if (mg && MINIGAMES[mg.id]) {
        const app = $('#app');
        app.innerHTML = '<article class="card mg-card"></article>';
        ({ won } = await MINIGAMES[mg.id](app.firstElementChild));
      }
      const c = E.applyChoice(S, ev, i, D.balance, { won });
      save();
      renderHud();
      if (S.phase === 'case') showCase();
      else showResult(c);
    };
  });
}

function showResult(c) {
  const notice = S.notice === 'marcusResigned'
    ? `<p class="notice">${esc(D.flavor.marcusResignedNotice)}</p>`
    : '';
  S.notice = null;
  save();
  screen(`
    <article class="card result">
      <p class="card-meta">You chose: ${esc(c.label)}</p>
      <p class="card-text">${esc(c.result)}</p>
      <div class="chips">${effectChips(c)}</div>
      ${notice}
      <button class="btn primary" id="next">Continue</button>
    </article>`);
  $('#next').onclick = route;
}

function showAct(act) {
  const [num, name] = act.title.split(' · ');
  screen(`
    <section class="act">
      <p class="card-meta">${esc(num)} · Weeks ${act.from}-${act.to}</p>
      <h2>${esc(name)}</h2>
      <button class="btn primary" id="next">Begin</button>
    </section>`);
  $('#next').onclick = () => { S.actShown = act.from; save(); route(); };
}

function showQuietWeek() {
  screen(`
    <article class="card">
      <p class="card-meta">Week ${S.week}</p>
      <p class="card-text">${esc(pick(D.flavor.quietWeek))}</p>
      <button class="btn primary" id="next">Next week</button>
    </article>`);
  $('#next').onclick = nextWeek;
}

function showWeekEnd() {
  if (S.phase === 'epilogue') {
    screen(`
      <article class="card">
        <p class="card-meta">Monday, 3:12pm</p>
        <p class="card-text">${esc(D.flavor.epilogueEnd)}</p>
        <button class="btn primary" id="next">See how it ends</button>
      </article>`);
    $('#next').onclick = nextWeek;
    return;
  }
  const msg = pick(D.flavor.slack);
  screen(`
    <article class="card weekend">
      <p class="card-meta">End of week ${S.week}</p>
      <div class="slack">
        <p class="slack-from"><b>${esc(msg.from)}</b> <span class="muted">in #${esc(msg.channel)}</span></p>
        <p>${esc(msg.text)}</p>
      </div>
      <button class="btn primary" id="next">${S.week >= D.balance.weeks ? 'Monday morning' : 'Next week'}</button>
    </article>`);
  $('#next').onclick = nextWeek;
}

function nextWeek() {
  E.endWeek(S, D.balance);
  save();
  route();
}

// The confirmation call: pick what you tell Derek. Opened by a choice with opensCase.
function showCase() {
  const max = D.balance.hr.maxEvidence;
  const best = new Set(E.bestPick(S, D.balance));
  const items = S.evidence.length
    ? S.evidence.map((e) => `
        <li><label class="ev-pick">
          <input type="checkbox" value="${esc(e.id)}" ${best.has(e.id) ? 'checked' : ''}>
          <span>${evidenceItem(e)}</span>
        </label></li>`).join('')
    : `<li class="muted">You kept nothing. No notes, no dates. Just "trust me".</li>`;
  const close = S.flags.includes('favourite')
    ? `<p class="muted small">Derek thinks you and Veronica are close. Coming from you, this will land hard.</p>`
    : '';
  screen(`
    <article class="card hr has-scene">
      ${sceneBanner('office', ['manager'])}
      <p class="card-meta">Phone call · Derek</p>
      <p class="card-text">${esc(D.flavor.hrIntro)}</p>
      <p><b>Pick up to ${max} things to tell him.</b> ${S.stats.allies} ${S.stats.allies === 1 ? 'colleague is' : 'colleagues are'} willing to back you up.</p>
      ${close}
      <ul class="ev-list">${items}</ul>
      <button class="btn primary" id="present">Tell Derek</button>
    </article>`);
  const boxes = [...document.querySelectorAll('.ev-pick input')];
  const sync = () => {
    const n = boxes.filter((b) => b.checked).length;
    boxes.forEach((b) => { b.disabled = !b.checked && n >= max; });
  };
  boxes.forEach((b) => (b.onchange = sync));
  sync();
  $('#present').onclick = () => {
    const { event, choice } = S.pending;
    E.submitCase(S, boxes.filter((b) => b.checked).map((b) => b.value), D.balance);
    save();
    renderHud();
    showResult(D.byId.get(event).choices[choice]);
  };
}

function showEnding() {
  const end = D.endings[S.ending];
  recordEnding(S.ending);
  const sc = S.score && S.ending !== 'marcusResigned'
    ? `<p class="score">Your account: evidence ${S.score.evidence} + allies ${S.score.allies} + reputation ${S.score.reputation}${S.score.favourite ? ` + "her favourite" ${S.score.favourite}` : ''} = <b>${S.score.total}</b></p>`
    : '';
  screen(`
    <article class="card ending ending-${esc(S.ending)} has-scene">
      ${sceneBanner(end.scene)}
      <p class="card-meta">Ending</p>
      <h2>${esc(end.title)}</h2>
      <p class="card-text">${esc(end.text)}</p>
      ${E.endingLines(S, D.endings._lines).map((t) => `<p class="card-text">${esc(t)}</p>`).join('')}
      ${sc}
      <button class="btn primary" id="again">Play again</button>
    </article>`);
  $('#again').onclick = () => { clearSave(); showTitle(); };
}

loadData()
  .then(showTitle)
  .catch((err) => {
    screen(`<p class="card">Could not load game data (${esc(err.message)}). Serve this folder over HTTP, e.g. <code>python3 -m http.server</code>.</p>`);
  });

</script>
</body>
</html>
